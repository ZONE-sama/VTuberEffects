Filter.Name="VTuber Effects"

Header.Name="VTuber Effects"
Header.Version="Version"

Environment.Source="Environment source or group"
Environment.None="None"
Environment.Warning="No environment source is selected. Select a full-frame source, scene, or group to enable environment-based lighting."
Environment.Source.Tooltip="Specifies the main source used to generate ambient lighting and, by default, rim lighting. Transparent areas are ignored when calculating the blurred environment color. For accurate alignment, use a full-frame source with the same aspect ratio as the filtered source."
Environment.RimSource="Rim environment source or group"
Environment.RimSource.Same="Same as main environment source"
Environment.RimSource.Tooltip="Optionally selects a different source, scene, or group for rim lighting. Leave this set to Same as main environment source to use one environment for both ambient and rim lighting."

Ambient.Group="Ambient lighting"
Ambient.Group.Tooltip="Covers the visible avatar with a heavily blurred version of the selected environment. This makes the avatar inherit the scene's general colors and brightness without showing recognizable background details."
Ambient.Enabled="Enable ambient lighting"
Ambient.Base="Base brightness"
Ambient.Base.Tooltip="Sets the minimum brightness retained before sampled environment colors are applied."
Ambient.Amount="Environment color amount"
Ambient.Amount.Tooltip="Controls how strongly sampled environment colors affect the avatar."
Ambient.Blur="Environment blur radius (pixels)"
Ambient.Blur.Tooltip="Sets how widely the environment image is blurred before its colors are sampled. Higher values produce smoother, more generalized lighting."
Ambient.Reset="Reset ambient lighting to defaults"

Processing.Group="Automatic exposure compensation"
Processing.Group.Tooltip="Controls the brightness and color intensity of the sampled environment before it is used by ambient and rim lighting. Exposure compensation restrains unusually bright scenes and lifts unusually dark scenes, while the color controls shape the resulting light."
Processing.ExposureEnabled="Enable automatic exposure compensation"
Processing.ExposureEnabled.Tooltip="Automatically adjusts the sampled environment toward the target brightness. This reduces lighting changes caused by unusually bright or dark scenes."
Processing.ExposureAffectsRim="Apply automatic exposure compensation to rim lighting"
Processing.ExposureAffectsRim.Tooltip="When enabled, automatic exposure also adjusts the environment used to color the rim light. Disable this to keep rim-light brightness independent while ambient lighting continues to use automatic exposure."
Processing.ExposureTarget="Target environment brightness"
Processing.ExposureTarget.Tooltip="Sets the brightness that automatic exposure attempts to maintain. Lower values produce darker, more restrained lighting."
Processing.ExposureStrength="Exposure compensation strength"
Processing.ExposureStrength.Tooltip="Controls how strongly automatic exposure corrects the sampled environment. A value of 0 makes no correction; 1 applies the full calculated compensation."
Processing.ExposureMin="Minimum exposure multiplier"
Processing.ExposureMin.Tooltip="Limits how much automatic exposure may darken a bright environment. Lower values permit stronger darkening."
Processing.ExposureMax="Maximum exposure multiplier"
Processing.ExposureMax.Tooltip="Limits how much automatic exposure may brighten a dark environment."
Processing.Saturation="Environment saturation"
Processing.Saturation.Tooltip="Controls the saturation of colors used for ambient and rim lighting. A value of 1 is unchanged; 0 is grayscale."
Processing.Vibrance="Environment vibrance"
Processing.Vibrance.Tooltip="Adjusts weaker colors more strongly than colors that are already saturated. Positive values enrich muted lighting; negative values subdue it."
Processing.Contrast="Environment contrast"
Processing.Contrast.Tooltip="Controls contrast in the sampled environment before it is applied as lighting. A value of 1 is unchanged."
Processing.ColorLimit="Maximum color intensity"
Processing.ColorLimit.Tooltip="Limits the strongest color channel while preserving hue. Lower values restrain highly saturated or intense environment colors."
Processing.Reset="Reset automatic exposure compensation to defaults"

Rim.Group="Rim lighting"
Rim.Group.Tooltip="Adds a directional band of environment-colored light just inside the avatar's outline. Width and softness shape the band, while scale and offset control which edges receive the strongest light."
Rim.Enabled="Enable rim lighting"
Rim.Amount="Rim brightness"
Rim.Amount.Tooltip="Controls the intensity of the rim light."
Rim.ColorAmount="Rim environment color amount"
Rim.ColorAmount.Tooltip="Controls how strongly the environment source colors the rim light."
Rim.LayerBase="Rim minimum brightness"
Rim.LayerBase.Tooltip="Sets how much of the Masked Duplicate rim remains visible when the sampled rim environment is black. Set this to 0 for no rim over black. Rim brightness can still amplify light from brighter environments."
Rim.BlendMode="Rim blend mode"
Rim.BlendMode.Tooltip="Selects how the rim light is combined with the avatar."
Rim.Blend.Additive="Additive"
Rim.Blend.Screen="Screen"
Rim.Blend.Normal="Normal mix"
Rim.Blend.MaskedDuplicate="Masked duplicate"
Rim.Width="Rim width (pixels)"
Rim.Width.Tooltip="Sets how far the rim light extends inward from the silhouette."
Rim.Softness="Rim softness"
Rim.Softness.Tooltip="Controls the transition between the rim light and the unlit portion of the avatar."
Rim.Scale="Rim mask scale"
Rim.Scale.Tooltip="Scales the silhouette used to calculate the rim light around the selected pivot point."
Rim.PivotX="Rim scale pivot X (%)"
Rim.PivotX.Tooltip="Sets the horizontal center used when scaling the rim mask. Position it over the center of an off-center avatar."
Rim.PivotY="Rim scale pivot Y (%)"
Rim.PivotY.Tooltip="Sets the vertical center used when scaling the rim mask. Position it over the center of an off-center avatar."
Rim.OffsetX="Horizontal offset (pixels)"
Rim.OffsetX.Tooltip="Moves the rim mask horizontally."
Rim.OffsetY="Vertical offset (pixels)"
Rim.OffsetY.Tooltip="Moves the rim mask vertically."
Rim.Reset="Reset rim lighting to defaults"

Keys.Group="Protected light colors"
Keys.Group.Tooltip="Finds specified colors in the original avatar and restores those pixels over the lighting result. Optional emissive bloom can spread their original colors into a soft halo around eyes, lamps, displays, and other illuminated details."
Keys.Enabled="Enable protected light colors"
Keys.Count="Protected color count"
Keys.Count.Tooltip="Sets the number of protected color entries displayed and processed."
Keys.Color="Color"
Keys.Color.Tooltip="Selects the source color to preserve."
Keys.ColorGroup.Tooltip="Contains the matching controls for one protected color."
Keys.Tolerance="Color tolerance"
Keys.Tolerance.Tooltip="Controls how much a pixel may differ from the selected color and still be matched."
Keys.Softness="Match softness"
Keys.Softness.Tooltip="Softens the transition between matched and unmatched pixels."
Keys.MinSaturation="Minimum saturation"
Keys.MinSaturation.Tooltip="Sets the minimum color saturation required for a pixel to be matched."
Keys.MinBrightness="Minimum brightness"
Keys.MinBrightness.Tooltip="Sets the minimum brightness required for a pixel to be matched."
Keys.Strength="Protection strength"
Keys.Strength.Tooltip="Controls how strongly matched pixels are restored to their original appearance."
Keys.Reset="Reset protected colors to defaults"

Bloom.Enabled="Enable protected-color bloom"
Bloom.Enabled.Tooltip="Creates a soft light halo from pixels matched by Protected Light Colors. Each halo inherits the original matched color."
Bloom.Amount="Emissive bloom brightness"
Bloom.Amount.Tooltip="Controls the intensity of the light emitted around protected-color pixels."
Bloom.Radius="Emissive bloom radius (pixels)"
Bloom.Radius.Tooltip="Sets how far protected-color light spreads into the avatar and surrounding transparent area. Larger values require more GPU work."

Shadow.Group="Drop shadow"
Shadow.Group.Tooltip="Places a colored copy of the avatar's silhouette behind the original, then blurs and offsets it. The result looks like a soft shadow cast onto the scene behind the avatar."
Shadow.Enabled="Enable drop shadow"
Shadow.Color="Shadow color"
Shadow.Color.Tooltip="Selects the shadow color."
Shadow.Opacity="Shadow opacity"
Shadow.Opacity.Tooltip="Controls the opacity of the shadow."
Shadow.Blur="Shadow blur radius (pixels)"
Shadow.Blur.Tooltip="Controls the softness and spread of the shadow."
Shadow.OffsetX="Horizontal shadow offset (pixels)"
Shadow.OffsetX.Tooltip="Moves the shadow horizontally. Positive values move it to the right."
Shadow.OffsetY="Vertical shadow offset (pixels)"
Shadow.OffsetY.Tooltip="Moves the shadow vertically. Positive values move it downward."
Shadow.Reset="Reset drop shadow to defaults"

Glow.Group="Outer glow"
Glow.Group.Tooltip="Surrounds the outside of the avatar with a smooth colored halo. Width controls how far it spreads, brightness controls its intensity, and blend mode determines how the halo lightens the background."
Glow.Enabled="Enable outer glow"
Glow.Color="Glow color"
Glow.Color.Tooltip="Selects the color of the outer glow."
Glow.BlendMode="Glow blend mode"
Glow.BlendMode.Tooltip="Selects how the glow is combined with the background."
Glow.Blend.Additive="Additive"
Glow.Blend.Screen="Screen"
Glow.Blend.Normal="Normal"
Glow.Amount="Glow brightness"
Glow.Amount.Tooltip="Controls the intensity and opacity of the outer glow."
Glow.Width="Glow width (pixels)"
Glow.Width.Tooltip="Sets how far the glow extends outside the avatar silhouette."
Glow.Reset="Reset outer glow to defaults"

Debug.View="Diagnostic view"
Debug.View.Tooltip="Displays an individual processing stage for setup and troubleshooting."
Debug.Final="Final output"
Debug.Environment="Blurred environment"
Debug.Ambient="Ambient pass"
Debug.Rim="Rim pass"
Debug.Emissive="Protected color mask"
Debug.Original="Original capture"
Debug.Shadow="Drop shadow pass"
Debug.Glow="Outer glow pass"
Debug.EmissiveBloom="Emissive bloom pass"

Preset.Group="Import and export settings"
Preset.Group.Tooltip="Saves the effect controls to a shareable JSON text file or loads them from one. Environment source selections and diagnostic view are kept local and are not included."
Preset.Export="Export settings"
Preset.Import="Import settings"
Preset.Status.Ready="Export the current effects to a JSON preset or import a previously saved preset."
Preset.Status.Exported="Settings exported successfully."
Preset.Status.ExportFailed="The preset could not be written. Check the selected location and file permissions."
Preset.Status.Imported="Settings imported successfully."
Preset.Status.ImportFailed="The preset could not be read. Check that it is a valid VTuber Effects JSON preset."
